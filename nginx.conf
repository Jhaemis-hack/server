worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen ${PORT};  # Ensure PORT is set in the environment
        server_name _;


        location / {
            proxy_pass https://fast-api-nine-henna.vercel.app/;
            proxy_set_header Host fast-api-nine-henna.vercel.app;  # Ensure Vercel recognizes requests
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_verify off;  # Disable SSL verification if needed
        }
    }
}
