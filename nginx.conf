worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout 65;

    server {
        listen $PORT;  # Use Render's assigned PORT instead of a fixed one
        server_name _;  # Accept all domain requests

        location / {
            proxy_pass https://fast-api-nine-henna.vercel.app/;  # Change this to your Vercel app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
